<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>isui.ren</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import init from './isui_ren_heart.js'
      init().catch((e) => {
        // 错误上屏（诊断用）
        const pre = document.createElement('pre')
        pre.style.cssText =
          'position:fixed;inset:0;z-index:9999;background:#fff;color:#c00;padding:2rem;font-size:14px;white-space:pre-wrap;overflow:auto'
        pre.textContent = 'WASM 初始化失败:\n' + (e && e.stack ? e.stack : String(e))
        document.body.appendChild(pre)
        console.error('init failed:', e)
        throw e
      })
    </script>
  </body>
</html>
