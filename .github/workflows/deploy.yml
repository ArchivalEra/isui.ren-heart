# 一键部署：推 main → GitHub Actions 构建 wasm+dist → 推 deploy 分支
# → EdgeOne Makers 自动拉取 deploy 分支部署（零构建）
#
# 为什么用 deploy 分支：wasm 构建需要 Rust/cargo——EdgeOne Makers 的
# 构建环境没有 Rust——Actions（ubuntu 自带 cargo）构建好后把 dist 推给
# deploy 分支，Makers 只做静态部署（构建命令留空）。
# WARNING: 已弃 Cloudflare（全迁 EdgeOne）——不再生成 wrangler.toml/package.json。
name: deploy

# WARNING: GITHUB_TOKEN 写权限：除本声明外，仓库 Settings → Actions → General
# → Workflow permissions 必须为「Read and write permissions」——新仓库
# 默认只读会导致 push deploy 分支失败（deploy failed 第三真凶）
permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # node 26（26.12.1 起）：2026-10 安全修复线——CVE-2026-111497
          # （Brotli 越界写 RCE）/ 105482（DNS NUL 截断）/ 105483 + 106069
          # （TLS 主机名验证绕过）四项全修；满足 Astro engines >=22.23.4。
          # check-latest 防 runner 镜像缓存滞后安全发布（实测曾停在
          # 22.23.3）。
          node-version: 26
          check-latest: true

      - name: Install wasm-bindgen (prebuilt release)
        run: |
          # Cargo.toml 是宽松版本（"0.2"）——cargo install --version 匹配失败
          # （deploy failed 真凶）——改从 Cargo.lock 读精确版本 + 官方预编译
          # release 二进制直下（秒级——不用 cargo install 编译 10 分钟）
          cd web-rust
          VERSION=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep '^version' | grep -oP '"\K[0-9.]+')
          echo "wasm-bindgen-cli: $VERSION"
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz" -o wb.tar.gz
          tar xzf wb.tar.gz
          mv "wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" ~/.cargo/bin/
          wasm-bindgen --version

      - name: Build wasm + frontend
        run: |
          cd web-ui
          npm ci
          ./build.sh

      - name: Pull Mijo slot (catalogue site, read-only)
        # Mijo 仓只负责产出 site/（catalogue.json + index.html）；它不持有
        # 本仓的写权限，也不需要——本步主动拉它的 main，放进 deploy 的 Mijo/。
        # 这与 Bahnhof / Blog / S26 的「各仓自己推」不同：那两个用 SSH key
        # 有写权限，而 Mijo 走的是「heart 来取」，产物唯一产地在 Mijo。
        # 缺 token 时明说跳过（公开仓可匿名拉；私有仓需要 MJ_SOURCE_TOKEN）。
        env:
          MJ_SOURCE_TOKEN: ${{ secrets.MJ_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          REPO="ArchivalEra/Mijo"
          if [ -n "${MJ_SOURCE_TOKEN:-}" ]; then
            URL="https://x-access-token:${MJ_SOURCE_TOKEN}@github.com/${REPO}.git"
          else
            URL="https://github.com/${REPO}.git"
          fi
          rm -rf /tmp/mijo-src
          if ! git clone --depth 1 --branch main "$URL" /tmp/mijo-src 2>/dev/null; then
            echo "::warning::Mijo 取不到（私有仓需配 MJ_SOURCE_TOKEN）——本次不更新 Mijo/ slot"
            exit 0
          fi
          if [ ! -f /tmp/mijo-src/site/index.html ]; then
            echo "::warning::Mijo 仓没有 site/index.html——跳过"
            exit 0
          fi
          rm -rf /tmp/deploy-out/Mijo
          mkdir -p /tmp/deploy-out/Mijo
          cp -r /tmp/mijo-src/site/. /tmp/deploy-out/Mijo/
          echo "Mijo slot staged: $(find /tmp/deploy-out/Mijo -type f | wc -l) files"

      - name: Push dist to deploy branch (incremental, no force)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # deploy 是多仓共用的平面：heart 只拥有根目录（heart/ + 站点根文件），
          # 其余 slot（Bahnhof / Blog / MangoMesa / repo / Mijo）由各自的仓写。
          #
          # 历史教训（这段就是为此重写的）：旧实现 `checkout --orphan deploy`
          # + `--force` 每次重建整个分支，靠 PRESERVE_SLOTS 抢救别的 slot ——
          # 抢救名单漏一个就永久丢失（2026-08-22 冲掉 Bahnhof/，
          # 2026-10-08 冲掉 repo/）。名单是手写的，注定会漏。
          #
          # 现在改成增量：只删自己拥有的路径、只加自己的产物，普通 push。
          # 「自己拥有什么」是一个显式列表，而不是「别人的我记着别删」——
          # 前者漏了只会留下多余文件（无害），后者漏了会毁掉别人的产物。
          rm -rf /tmp/deploy-out
          mkdir -p /tmp/deploy-out/heart
          cp -r web-ui/dist/. /tmp/deploy-out/heart/
          cp -r site-root/. /tmp/deploy-out/

          git fetch origin deploy:refs/remotes/origin/deploy
          # 构建在工作区留下未跟踪产物（wasm-bindgen 的 tarball 等），
          # 直接 checkout 会被「untracked working tree files would be
          # overwritten」拒掉（实测 2026-11-12）。切分支前先清干净：
          # 这里的工作区内容已经全部复制到 /tmp/deploy-out，删掉是安全的。
          git clean -ffdx -e .git >/dev/null 2>&1 || true
          git reset --hard HEAD >/dev/null 2>&1 || true
          git checkout deploy 2>/dev/null || git checkout -b deploy refs/remotes/origin/deploy
          # 切到 deploy 后，工作区是分支内容；再清一次，确保只剩分支自己的文件
          git clean -fdx -e .git >/dev/null 2>&1 || true

          # 只清自己拥有的：heart/ 目录 + 站点根文件
          rm -rf heart
          for f in edgeone.json 404.html logo.png logo.svg middleware.js; do
            rm -f "$f"
          done

          cp -r /tmp/deploy-out/. .

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) from main $(git rev-parse --short main)"
          # 别的 slot 可能在这期间推过：先 rebase 再普通 push，绝不 force
          git pull --rebase origin deploy || true
          git push origin deploy 2>&1 | tail -5 || {
            echo "PUSH_FAILED——检查 GITHUB_TOKEN 权限（仓库 Settings→Actions→Workflow permissions→Read and write）"
            exit 1
          }
