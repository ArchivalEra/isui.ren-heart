# 一键部署：推 main → GitHub Actions 构建 wasm+dist → 推 deploy 分支
# → EdgeOne Makers 自动拉取 deploy 分支部署（零构建）
#
# 为什么用 deploy 分支：wasm 构建需要 Rust/cargo——EdgeOne Makers 的
# 构建环境没有 Rust——Actions（ubuntu 自带 cargo）构建好后把 dist 推给
# deploy 分支，Makers 只做静态部署（构建命令留空）。
# WARNING: 已弃 Cloudflare（全迁 EdgeOne）——不再生成 wrangler.toml/package.json。
name: deploy

# WARNING: GITHUB_TOKEN 写权限：除本声明外，仓库 Settings → Actions → General
# → Workflow permissions 必须为「Read and write permissions」——新仓库
# 默认只读会导致 push deploy 分支失败（deploy failed 第三真凶）
permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # node 26（26.12.1 起）：2026-10 安全修复线——CVE-2026-111497
          # （Brotli 越界写 RCE）/ 105482（DNS NUL 截断）/ 105483 + 106069
          # （TLS 主机名验证绕过）四项全修；满足 Astro engines >=22.23.4。
          # check-latest 防 runner 镜像缓存滞后安全发布（实测曾停在
          # 22.23.3）。
          node-version: 26
          check-latest: true

      - name: Install wasm-bindgen (prebuilt release)
        run: |
          # Cargo.toml 是宽松版本（"0.2"）——cargo install --version 匹配失败
          # （deploy failed 真凶）——改从 Cargo.lock 读精确版本 + 官方预编译
          # release 二进制直下（秒级——不用 cargo install 编译 10 分钟）
          cd web-rust
          VERSION=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep '^version' | grep -oP '"\K[0-9.]+')
          echo "wasm-bindgen-cli: $VERSION"
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz" -o wb.tar.gz
          tar xzf wb.tar.gz
          mv "wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" ~/.cargo/bin/
          wasm-bindgen --version

      - name: Build wasm + frontend
        run: |
          cd web-ui
          npm ci
          ./build.sh

      - name: Push dist to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve Bahnhof/, Blog/, MangoMesa/ from the existing deploy branch —
          # this job owns the root, not the slot repos. heart pushes no
          # longer pay the peer rebuild cost, and peer pushes no longer
          # get wiped by the next heart build.
          # NOTE: archive must run against the FETCHED local ref — GitHub
          # does not support `git archive --remote`, and swallowing that
          # failure once wiped Bahnhof/ off deploy (2026-08-22).
          git fetch origin deploy:refs/remotes/origin/deploy
          rm -rf /tmp/keep-deploy
          if git cat-file -e refs/remotes/origin/deploy 2>/dev/null; then
            # Bahnhof/ station, the Blog/ and MangoMesa/ slots, the repo/ slot-repo tree
            # (S26-1_202609's static site + the accelerated-mirror tree the inventory reads),
            # and the root 404 page belong to their own repos' pipelines / sibling
            # outputs - carry them across this rebuild untouched. repo/ was missing from
            # this list until 2026-10-08, when a heart deploy wiped it and killed
            # /repo/S26-1_202609/ (the middleware next()-served tree) plus the mirror tree.
            PRESERVE_SLOTS=()
            for slot in Bahnhof Blog MangoMesa repo 404.html; do
              if git rev-parse --verify --quiet "refs/remotes/origin/deploy:$slot" >/dev/null; then
                PRESERVE_SLOTS+=("$slot")
              fi
            done
            if [ ${#PRESERVE_SLOTS[@]} -gt 0 ]; then
              mkdir -p /tmp/keep-deploy
              git archive refs/remotes/origin/deploy -- "${PRESERVE_SLOTS[@]}" | tar -x -C /tmp/keep-deploy
            fi
          fi
          rm -rf /tmp/deploy-out
          # 应用住在 /heart/ 子目录（vite base 同步为 /heart/）；
          # 站点根 = 跳转页 + 404 页（site-root/），死路径由 404.html 接管
          mkdir -p /tmp/deploy-out/heart
          cp -r web-ui/dist/. /tmp/deploy-out/heart/
          cp -r site-root/. /tmp/deploy-out/
          # ── static/：Static-Contract 契约站（三通道并行的 EdgeOne 那一路）──
          # 三条线独立部署：Pages 由对方仓自己的管线发、Cloudflare 由我维护的
          # static-host Worker 发、EdgeOne 这条由本仓 deploy 分支的静态树直出。
          # **不做「eo 反代 cf」**——那不是独立部署，响应头还会带出 CF-RAY。
          #
          # 取字节的方式：clone 对方仓后用**它自己的构建器** `scripts/build-site.py`
          # 现场产出。不拷 `site/dist`——那个目录在对方仓里是 gitignore 的构建物
          # （实测 clone 下来只有 site/*.json 源文件），拷不到。
          # 用同一条构建管线也就是「三通道同源」在字节层的落地。
          # 对方仓设了 BUILD_FINGERPRINT 写进 index.html，可用于事后核对哪个
          # 通道吃到了哪次产物（他们 scripts/verify-channels.py 就靠这个抓
          # 「EO 返回旧构建」那类事故）。
          if git clone --depth 1 https://github.com/ArchivalEra/Static-Contract.git /tmp/sc 2>/dev/null; then
            if python3 /tmp/sc/scripts/build-site.py --out /tmp/sc/dist 2>&1; then
              mkdir -p /tmp/deploy-out/static
              cp -r /tmp/sc/dist/. /tmp/deploy-out/static/
              echo "static/: $(find /tmp/deploy-out/static -type f | wc -l) files"
              grep -o 'BUILD_FINGERPRINT[^<]*' /tmp/deploy-out/static/index.html 2>/dev/null | head -1 || true
            else
              echo "::warning::Static-Contract 构建失败 —— /static 将 404"
            fi
          else
            echo "::warning::clone Static-Contract 失败 —— /static 将 404"
          fi
          # 先删本地分支——deploy 已存在时 checkout --orphan 会游离,绿勾假象
          git branch -D deploy 2>/dev/null || true
          git checkout --orphan deploy
          git rm -rf . --quiet 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/deploy-out/. .
          # Restore Bahnhof/, Blog/, MangoMesa/ and 404.html if they existed before
          # this run
          for slot in Bahnhof Blog MangoMesa repo; do
            if [ -d "/tmp/keep-deploy/$slot" ]; then
              rm -rf "./$slot"
              cp -r "/tmp/keep-deploy/$slot" "./$slot"
            fi
          done
          if [ -f /tmp/keep-deploy/404.html ]; then
            cp /tmp/keep-deploy/404.html ./404.html
          fi
          git add -A
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) from main $(git rev-parse main)"
          git push origin deploy --force 2>&1 || { echo "PUSH_FAILED——检查 GITHUB_TOKEN 权限（仓库 Settings→Actions→Workflow permissions→Read and write）"; exit 1; }
