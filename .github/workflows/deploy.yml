# 一键部署：推 main → GitHub Actions 把 site-root/ 推给 deploy 分支
# → EdgeOne Makers 自动拉取 deploy 分支部署（零构建）
#
# tayori（wasm 前端）已退役：站点根现在只是 Bahnhof 风格的 404 页，
# 不再需要 Rust/cargo 构建。Bahnhof/ 子目录归 Bahnhof 流水线所有，
# 这里原样保留。⚠️ 已弃 Cloudflare（全迁 EdgeOne）。


# ⚠️ GITHUB_TOKEN 写权限：除本声明外，仓库 Settings → Actions → General
# → Workflow permissions 必须为「Read and write permissions」——新仓库
# 默认只读会导致 push deploy 分支失败（deploy failed 第三真凶）
permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push site root to deploy branch
        run: |
          # tayori 已退役：站点根 = site-root/（Bahnhof 风格 404 + 空 edgeone 配置）。
          # Bahnhof/ 子目录仍归 Bahnhof 流水线所有，这里原样保留。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin deploy:refs/remotes/origin/deploy 2>/dev/null || true
          rm -rf /tmp/keep-bahnhof
          if git ls-remote --exit-code origin refs/heads/deploy >/dev/null 2>&1; then
            mkdir -p /tmp/keep-bahnhof
            git archive --remote=origin deploy -- Bahnhof 2>/dev/null | tar -x -C /tmp 2>/dev/null || true
            if [ -d /tmp/Bahnhof ]; then
              mv /tmp/Bahnhof /tmp/keep-bahnhof/Bahnhof
            fi
          fi
          rm -rf /tmp/deploy-out
          mkdir -p /tmp/deploy-out
          cp -r site-root/. /tmp/deploy-out/
          # 先删本地分支——deploy 已存在时 checkout --orphan 会游离,绿勾假象
          git branch -D deploy 2>/dev/null || true
          git checkout --orphan deploy
          git rm -rf . --quiet 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/deploy-out/. .
          # Restore Bahnhof/ if it existed before this run
          if [ -d /tmp/keep-bahnhof/Bahnhof ]; then
            rm -rf ./Bahnhof
            cp -r /tmp/keep-bahnhof/Bahnhof ./Bahnhof
          fi
          git add -A
          git commit -m "deploy root: $(date -u +%Y-%m-%dT%H:%M:%SZ) from main $(git rev-parse main)"
          git push origin deploy --force 2>&1 || { echo "PUSH_FAILED——检查 GITHUB_TOKEN 权限（仓库 Settings→Actions→Workflow permissions→Read and write）"; exit 1; }
