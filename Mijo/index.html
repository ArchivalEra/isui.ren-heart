<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仓库目录</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 980px; margin: 3rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { background: #f6f6f6; }
  td.desc { color: #555; max-width: 26rem; }
  td.num { color: #666; white-space: nowrap; }
  .note { color: #666; font-size: .9rem; }
</style>
<h1>仓库目录</h1>
<p class="note" id="note"></p>
<table>
  <thead>
    <tr><th>名称</th><th>维护者</th><th>描述</th><th>最后 commit</th><th>License</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

fetch('catalogue.json').then(r => r.json()).then(d => {
  document.getElementById('note').textContent = d.note || '';
  const rows = document.getElementById('rows');
  if (!d.entries.length) {
    rows.innerHTML = '<tr><td colspan="5" class="note">暂无条目 —— 往 material/urls.txt 里粘一个 URL。</td></tr>';
    return;
  }
  rows.innerHTML = d.entries.map(e => `<tr>
      <td><a href="${esc(e.url)}">${esc(e.name)}</a></td>
      <td>${esc(e.maintainer ?? '—')}</td>
      <td class="desc">${esc(e.description ?? '—')}</td>
      <td class="num">${e.lastCommit ? esc(e.lastCommit.slice(0, 10)) : '—'}</td>
      <td>${esc(e.license ?? '—')}</td>
    </tr>`).join('');
});
</script>
