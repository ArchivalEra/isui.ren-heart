<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijo — 仓库目录</title>
<link rel="stylesheet" href="face-grid.css">
<style>
  :root {
    --ink: #111;
    --dim: #666;
    --line: #e6e6e6;
    --bg: #fff;
    --fallback: #d8d8d8;
    --shadow: rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e9e9e9;
      --dim: #989898;
      --line: #2b2b2b;
      --bg: #151515;
      --fallback: #f2f2f2;
      --shadow: rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 1000px; margin: 0 auto; padding: 3rem 1.25rem 5rem;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 .2rem; }
  .tagline { color: var(--dim); font-size: .875rem; margin: 0 0 1.75rem; }

  table { border-collapse: collapse; width: 100%; }
  th, td {
    text-align: left; padding: .6rem .65rem;
    border-bottom: 1px solid var(--line); vertical-align: middle;
  }
  th {
    font-weight: 600; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--dim);
  }
  td.desc { color: var(--dim); font-size: .875rem; max-width: 22rem; }
  td.num { color: var(--dim); font-size: .85rem; white-space: nowrap;
           font-variant-numeric: tabular-nums; }
  td.lic { color: var(--dim); font-size: .8rem; white-space: nowrap; }
  /* 维护者列：单个头像，与 FaceGrid 的 .face 同尺寸 */
  .owner-face { width: 40px; height: 40px; border-radius: 50%; }
  a { color: inherit; text-decoration: none; }
  a.repo { font-weight: 500; }
  a.repo:hover { text-decoration: underline; }
  .empty { color: var(--dim); padding: 1.5rem 0; }
  footer { margin-top: 2.5rem; color: var(--dim); font-size: .78rem; }
  footer .legal a { text-decoration: underline; text-underline-offset: 2px; }
  footer .copyright { margin-top: .35rem; }
</style>

<h1>Mijo</h1>
<p class="tagline">a git catalogue for every human and machine</p>

<table>
  <thead>
    <tr>
      <th>仓库</th><th>维护者</th><th>Contributors</th><th>描述</th><th>最后提交</th><th>License</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<footer>
  <span id="stamp"></span>
  <span class="legal">
    · <a href="https://github.com/ArchivalEra/Mijo" target="_blank" rel="noopener">source</a>
    · <a href="https://github.com/ArchivalEra/Mijo/blob/main/LICENSE" target="_blank" rel="noopener">AGPL-3.0</a>
  </span>
  <div class="copyright">© 2026 ArchivalEra</div>
</footer>

<script type="module">
import { createFaceGrid } from './face-grid.js';

const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

fetch('catalogue.json').then(r => r.json()).then(d => {
  const entries = d.entries ?? [];
  const rows = document.getElementById('rows');

  if (!entries.length) {
    rows.innerHTML = '<tr><td colspan="6" class="empty">暂无条目 —— 往 material/urls.txt 里粘一个 URL。</td></tr>';
  } else {
    rows.innerHTML = '';
    for (const e of entries) {
      const tr = document.createElement('tr');
      const date = e.lastCommit ? new Date(e.lastCommit).toISOString().slice(0, 10) : '—';

      tr.innerHTML =
        `<td><a class="repo" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a></td>` +
        `<td></td>` +
        `<td></td>` +
        `<td class="desc">${esc(e.description ?? '—')}</td>` +
        `<td class="num">${esc(date)}</td>` +
        `<td class="lic">${esc(e.license ?? '—')}</td>`;

      // 维护者：单个头像 + 该平台的人物主页链接
      const owner = document.createElement(e.profile ? 'a' : 'span');
      owner.className = 'face owner-face';
      owner.title = e.maintainer ?? '';
      if (e.profile) {
        owner.href = e.profile;
        owner.target = '_blank';
        owner.rel = 'noopener';
      }
      const initial = (e.maintainer || '?').trim().charAt(0).toUpperCase();
      if (e.avatar) {
        const img = new Image();
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        img.loading = 'lazy';
        img.onerror = () => { img.remove(); owner.textContent = initial; };
        img.src = e.avatar;
        owner.appendChild(img);
      } else {
        owner.textContent = initial;
      }
      tr.children[1].appendChild(owner);

      // Contributors：整个交互藏在 FaceGrid 模块里，这里只有一行
      const cs = e.contributors ?? [];
      if (cs.length) {
        tr.children[2].appendChild(createFaceGrid({
          people: cs,
          total: Number.isFinite(e.contributorTotal) ? e.contributorTotal : null,
        }));
      }

      rows.appendChild(tr);
    }
  }

  if (d.generatedAt) {
    document.getElementById('stamp').textContent =
      'derived ' + new Date(d.generatedAt).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  }
}).catch(err => {
  document.getElementById('rows').innerHTML =
    `<tr><td colspan="6" class="empty">读取 catalogue.json 失败：${esc(err.message)}</td></tr>`;
});
</script>
